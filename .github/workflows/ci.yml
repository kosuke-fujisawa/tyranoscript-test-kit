name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit
      - name: パッケージルートのimportスモークテスト
        run: node --input-type=module -e "await import('./src/e2e-helpers.js'); await import('./src/check-scenario.js'); console.log('import OK')"
