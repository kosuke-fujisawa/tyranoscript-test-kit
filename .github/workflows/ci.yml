name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit
      - name: パッケージルートのimportスモークテスト
        run: node --input-type=module -e "await import('./src/e2e-helpers.js'); await import('./src/check-scenario.js'); console.log('import OK')"
