name: pr-agent

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: PR Agent
        uses: qodo-ai/pr-agent@17651f75b2b29268eb32d5d9a9227b8f3a7c1131 # main (2026-08-05時点)
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
