name: pr-agent

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: PR Agent
        uses: qodo-ai/pr-agent@6981f4951f44ef80d85a0753ace47a5cfa328592 # main (2026-08-05時点)
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
